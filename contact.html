<header>
    <h1>💌 Let's Be Friends!</h1>
    <p>Silakan tinggalkan pesan untukku.</p>
</header>

<main class="container">
    <form>
        <h2>🌷 Kirim Pesan</h2>

        <label for="nama">Nama</label>
        <input type="text" id="nama" placeholder="Nama kamu..." required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email kamu..." required>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" rows="5" placeholder="Tulis pesanmu..." required></textarea>

        <button type="submit">Kirim Pesan 💗</button>
    </form>
</main>
